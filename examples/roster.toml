# Example roster — binds each role to a {provider, model}.
#
# Secrets are NOT here: provider API keys come from the environment
# (ANTHROPIC_API_KEY, GEMINI_API_KEY). A roster file containing a key is
# rejected on load.

[roles]
chief     = { provider = "anthropic", model = "claude-fable-5" }
worker    = { provider = "anthropic", model = "claude-sonnet-5" }
validator = { provider = "google",    model = "gemini-3-pro" }
