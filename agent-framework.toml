# This repo's own team configuration (dogfooding project-portability R-2).
# [roles] binds each role to a model (ADR 0001); [project] tells the roles
# this project's gate and conventions. Secrets never live here.

[roles]
chief     = { provider = "anthropic", model = "claude-fable-5-1" }
worker    = { provider = "anthropic", model = "claude-sonnet-5-5" }
# Bound by what the eval set measures (ADR 0009); the scorecard for this
# line is evals/validator/results/claude-opus-high-full.json. The previous
# binding, one line away: { provider = "google", model = "gemini-3.8-flash" }
validator = { provider = "anthropic", model = "claude-opus-5-5", effort = "high" }

[project]
gate_commands = [
    "uv run ruff check .",
    "uv run mypy --strict",
    "uv run pytest",
    "uv run python scripts/check_spec_coverage.py --include-approved",
]
conventions_note = "Read CLAUDE.md and docs/glossary.md; use the glossary's terms exactly."
ignore_checks = ["validator"]
# How far worker sessions are widened beyond the confinement profile's
# defaults (ADR 0007): what this repo's gate needs, and nothing else.
session_write_paths = ["~/.cache/uv"]         # uv's cache
session_read_paths  = ["~/.local/share/uv"]   # uv-managed Python builds
session_network     = ["pypi.org", "files.pythonhosted.org"]
