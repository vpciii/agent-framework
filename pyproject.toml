[project]
name = "agent-framework"
version = "0.0.0"
description = "Hierarchical, model-agnostic agent orchestration over the methodology's artifacts"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_framework"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["src", "tests"]
