name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy --strict
      - name: Tests
        run: uv run pytest
      - name: Spec coverage (methodology §5, ADR 0003)
        run: uv run python scripts/check_spec_coverage.py --include-approved
