name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy --strict
      - name: Tests
        run: uv run pytest
      - name: Spec coverage (methodology §5, ADR 0003)
        run: uv run python scripts/check_spec_coverage.py --include-approved

  # Advisory dogfooding of the cite-the-test gate (ADR 0005): a verdict on
  # every PR, never blocking — not in the ruleset's required checks, and
  # continue-on-error keeps the workflow green on a REJECT. Deterministic
  # REJECTs cost zero model calls; the judgment call runs only when the
  # GEMINI_API_KEY secret is configured.
  validator:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
      checks: read     # statusCheckRollup queries check runs
      statuses: read   # ...and classic commit statuses
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Cite-the-test gate (advisory)
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::GEMINI_API_KEY secret not set — advisory validator skipped"
            exit 0
          fi
          uv run python -m agent_framework.validator ${{ github.event.pull_request.number }}
